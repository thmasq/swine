name: Build and Release Swine

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel rust cargo git python python-pyelftools bc cpio elfutils clang libseccomp virglrenderer pipewire wayland

      - name: Checkout Swine
        uses: actions/checkout@v4
        with:
          path: swine

      - name: Checkout libkrunfw
        uses: actions/checkout@v4
        with:
          repository: libkrun/libkrunfw
          path: libkrunfw

      - name: Checkout libkrun
        uses: actions/checkout@v4
        with:
          repository: libkrun/libkrun
          path: libkrun

      - name: Build libkrunfw (with 32-bit support)
        run: |
          cd libkrunfw
          sed -i 's/# CONFIG_IA32_EMULATION is not set/CONFIG_IA32_EMULATION=y/' config-libkrunfw_x86_64
          sed -i 's/# CONFIG_COMPAT_32BIT_TIME is not set/CONFIG_COMPAT_32BIT_TIME=y/' config-libkrunfw_x86_64
          make -j$(nproc)
          make PREFIX=/usr install

      - name: Build libkrun
        run: |
          cd libkrun
          make -j$(nproc)
          make PREFIX=/usr install

      - name: Build Swine (Statically Linked to Krun)
        run: |
          cd swine
          KRUN_STATIC=1 cargo build --release

      - name: Prepare Release
        run: |
          mkdir release
          cp swine/target/release/swine release/
          cp swine/target/release/swine-guest release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swine-release
          path: release/
